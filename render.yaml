services:
  - type: web
    name: codechat-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://client-inky-zeta-45.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 10000
      - key: RATE_LIMIT_MAX_MESSAGES
        value: 10
      - key: MAX_CODE_LENGTH
        value: 2000
      - key: MAX_OUTPUT_LENGTH
        value: 5000
      - key: MAX_LOOP_ITERATIONS
        value: 20
      - key: VALIDATION_TIMEOUT_MS
        value: 1000
